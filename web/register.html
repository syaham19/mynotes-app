<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — My Personal Notes</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>📝 My Personal Notes</h1>
            <p class="auth-subtitle">Buat akun baru</p>

            <!-- Pesan error/sukses -->
            <div id="alert" class="alert" style="display: none;"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" placeholder="Nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Ulangi password" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary" id="btn-register">Daftar</button>
            </form>

            <p class="auth-link">
                Sudah punya akun? <a href="/">Masuk di sini</a>
            </p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
